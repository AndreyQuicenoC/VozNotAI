services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: sqlite:////data/voznotai.db
      UPLOAD_DIR: /data/uploads
      FRONTEND_ORIGIN: http://localhost:3000
    volumes:
      - voznotai-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/system/health')"]
      interval: 20s
      timeout: 5s
      retries: 5

volumes:
  voznotai-data:
