name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Instalar dependencias de la API
        run: pip install -r backend/requirements.txt
      - name: Pruebas de backend
        run: python -m pytest backend/tests --cov=backend --cov-report=term-missing --cov-fail-under=0

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Instalar dependencias
        run: npm install
      - name: Pruebas de lógica del frontend
        run: npx tsx --test src/utils/*.test.ts src/services/*.test.ts
